name: CI/CD - Build & Deploy (Tier 2)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js (For Linting & Security Scan)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Trivy Security Scan (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile  
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/midterm-app:latest
            ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }}

      - name: Deploy to AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd ~/deployment-midterm
            
            # Pull image with timeout (prevent hanging)
            echo "⏱️ Pulling image (timeout 60s)..."
            timeout 60 docker-compose -f docker/docker-compose.yml pull || {
              echo "⚠️ Pull timeout/slow, trying individual services..."
              timeout 30 docker pull ${DOCKER_USERNAME}/midterm-app:latest || echo "⚠️ Using cached image"
            }
            
            # Quick restart
            echo "🔄 Quick restart..."
            docker-compose -f docker/docker-compose.yml down --remove-orphans
            docker-compose -f docker/docker-compose.yml up -d
            
            echo "✅ Done in $(date)"
            docker ps --format "table {{.Names}}\t{{.Status}}"
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
