name: CI/CD - Build & Deploy (Tier 2)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js (For Linting & Security Scan)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Trivy Security Scan (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile  
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/midterm-app:latest
            ${{ secrets.DOCKER_USERNAME }}/midterm-app:${{ github.sha }}

      - name: Deploy to AWS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        command_timeout: 10m
        script: |
          set -e
          
          echo " Starting deployment..."
          cd ~
          
          # Fast clone with depth 1 (only latest commit)
          if [ -d "deployment-midterm" ]; then
            echo "Updating existing repo..."
            cd deployment-midterm
            git fetch --depth 1 origin main
            git reset --hard origin/main
            git clean -fd
          else
            echo "📥 Cloning repo (shallow clone)..."
            git clone --depth 1 https://github.com/Jackcodevn/deployment-midterm.git
            cd deployment-midterm
          fi
          
          echo "Pulling Docker image..."
          docker-compose -f docker/docker-compose.yml pull
          
          echo "Deploying containers..."
          docker-compose -f docker/docker-compose.yml up -d --force-recreate
          
          echo "Deployment complete!"
          docker-compose -f docker/docker-compose.yml ps
